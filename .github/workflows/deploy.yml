name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: |
          mkdir -p dist
          cp -r public/* dist/
          mkdir -p dist/games
          cp -r games/* dist/games/ 2>/dev/null || true
          cp game-config.json dist/ 2>/dev/null || true
          ls -laR dist/
          echo "Build complete"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        uses: actions/deploy-pages@v4
